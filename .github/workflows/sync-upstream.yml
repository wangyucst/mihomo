name: Sync upstream + reapply custom patch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'    # 每天 UTC 18:00（北京时间凌晨2点）自动同步

permissions:
  contents: write
  issues: write
  actions: write            # 赋予触发其他工作流的权限

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: Meta
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/MetaCubeX/mihomo.git 2>/dev/null || true
          git fetch upstream Meta
          git fetch --force --tags upstream

      - name: Check if already up to date
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/Meta)
          if [ -f .upstream-commit ] && [ "$(cat .upstream-commit)" = "$UPSTREAM_SHA" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Reset branch to upstream and reapply patch
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          set -e
          
          # 1. 仅备份 patches 目录与这两个指定的自定义工作流文件
          mkdir -p /tmp/custom_backup/workflows
          [ -d patches ] && cp -r patches /tmp/custom_backup/
          [ -f .github/workflows/sync-upstream.yml ] && cp .github/workflows/sync-upstream.yml /tmp/custom_backup/workflows/
          [ -f .github/workflows/build-android-arm64.yml ] && cp .github/workflows/build-android-arm64.yml /tmp/custom_backup/workflows/

          # 2. 重置为上游最新状态（正常接收上游 .github 中其他文件更新）
          git reset --hard upstream/Meta

          # 3. 将你的两个工作流和补丁恢复回去
          [ -d /tmp/custom_backup/patches ] && cp -r /tmp/custom_backup/patches .
          mkdir -p .github/workflows
          [ -f /tmp/custom_backup/workflows/sync-upstream.yml ] && cp /tmp/custom_backup/workflows/sync-upstream.yml .github/workflows/
          [ -f /tmp/custom_backup/workflows/build-android-arm64.yml ] && cp /tmp/custom_backup/workflows/build-android-arm64.yml .github/workflows/

          # 4. 校验并应用免流补丁
          if git apply --check patches/with-at.patch 2>/tmp/apply-err.log; then
            git apply patches/with-at.patch
          else
            echo "PATCH_FAILED=true" >> "$GITHUB_ENV"
            cat /tmp/apply-err.log
            exit 1
          fi

          echo "${{ steps.check.outputs.upstream_sha }}" > .upstream-commit

          git add -A
          git commit -m "chore: sync upstream (${{ steps.check.outputs.upstream_sha }}) + reapply With-At patch"
          git push origin Meta --force

      - name: Trigger build workflow
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          gh workflow run build-android-arm64.yml --ref Meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Open issue if patch failed to apply
        if: failure()
        continue-on-error: true
        run: |
          gh issue create \
            --title "⚠️ 自动同步失败：With-At 补丁无法应用" \
            --body "上游 mihomo 有更新，但自动重新应用 patches/with-at.patch 失败了，需要你手动合并一下 adapter/outbound/http.go。日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Already up to date
        if: steps.check.outputs.up_to_date == 'true'
        run: echo "已经是最新，无需同步。"
