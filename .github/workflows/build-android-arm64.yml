name: Build Android (arm64 & armv7)

on:
  workflow_dispatch:
  push:
    branches:
      - Meta
    paths-ignore:
      - '**.md'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Fetch upstream tags (so version tracks upstream, not this fork)
        run: |
          git remote add upstream https://github.com/MetaCubeX/mihomo.git 2>/dev/null || true
          git fetch --force --tags upstream

      - name: Resolve version (follows upstream author's version)
        id: vars
        run: |
          # 优先使用记录的上游 Commit SHA，不存在则锚定 upstream/Meta 分支
          if [ -f .upstream-commit ]; then
            REF=$(cat .upstream-commit)
          else
            REF=upstream/Meta
          fi
          
          # --abbrev=0 剥离尾部 Commit 偏移量和 Hash，只保留纯净的官方 Tag（如 v1.19.0）
          VERSION=$(git describe --tags --abbrev=0 "$REF" 2>/dev/null || git describe --tags --always "$REF")
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "buildtime=$(date -u)" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (from ref $REF)"

      # ================= 【编译 ARM64】 =================
      - name: Build and Compress mihomo (android/arm64)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build \
            -tags with_gvisor \
            -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ steps.vars.outputs.version }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ steps.vars.outputs.buildtime }}' -w -s" \
            -o mihomo-android-arm64 .
          
          gzip -f mihomo-android-arm64

      # ================= 【编译 ARMv7】 =================
      - name: Build and Compress mihomo (android/armv7)
        env:
          GOOS: android
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
        run: |
          go build \
            -tags with_gvisor \
            -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ steps.vars.outputs.version }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ steps.vars.outputs.buildtime }}' -w -s" \
            -o mihomo-android-armv7 .
          
          gzip -f mihomo-android-armv7

      # ================= 【上传 Artifacts】 =================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-android-${{ steps.vars.outputs.version }}
          path: mihomo-android-*.gz
          retention-days: 14

      # ================= 【发布 Release】 =================
      - name: Create or Update Release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          
          gh release create latest mihomo-android-arm64.gz mihomo-android-armv7.gz \
            --title "Mihomo Android Multi-Arch (FreeFlow Custom)" \
            --notes "基于上游最新 Commit (${{ steps.vars.outputs.version }}) 编译，包含 ARM64 与 ARMv7 (32位) 架构，支持 With-At 免流。" \
            --target Meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
