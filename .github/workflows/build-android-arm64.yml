name: Build Android arm64

on:
  workflow_dispatch:
  push:
    branches:
      - Meta
    paths-ignore:
      - '**.md'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Fetch upstream tags (so version tracks upstream, not this fork)
        run: |
          git remote add upstream https://github.com/MetaCubeX/mihomo.git 2>/dev/null || true
          git fetch --force --tags upstream

      - name: Resolve version (follows upstream author's version)
        id: vars
        run: |
          if [ -f .upstream-commit ]; then
            REF=$(cat .upstream-commit)
          else
            REF=HEAD
          fi
          VERSION=$(git describe --tags --always "$REF")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "buildtime=$(date -u)" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (from ref $REF)"

      - name: Build and Compress mihomo (android/arm64)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build \
            -tags with_gvisor \
            -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ steps.vars.outputs.version }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ steps.vars.outputs.buildtime }}' -w -s" \
            -o mihomo-android-arm64 .
          
          # 打包为 .gz 格式
          gzip -f mihomo-android-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-android-arm64-${{ steps.vars.outputs.version }}
          path: mihomo-android-arm64.gz
          retention-days: 14

      - name: Create or Update Release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          
          gh release create latest mihomo-android-arm64.gz \
            --title "Mihomo Android ARM64 (FreeFlow Custom)" \
            --notes "基于上游最新 Commit (${{ steps.vars.outputs.version }}) 编译，支持 With-At 免流。" \
            --target Meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
